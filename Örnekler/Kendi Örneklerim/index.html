<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Hesaplama Aracı</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7fa;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 25px;
            padding: 20px;
            border: 2px solid #28a745;
            border-radius: 8px;
            background-color: #e9f7ed;
            display: none; /* Başlangıçta gizli */
        }
        .result-item {
            margin-bottom: 10px;
        }
        .result-item span {
            font-weight: bold;
            color: #333;
            display: inline-block;
            width: 150px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Not Hesaplama</h2>
    
    <div class="input-group">
        <label for="v1">Vize Notu (V1):</label>
        <input type="number" id="v1" placeholder="Örnek: 65" min="0" max="100">
    </div>

    <div class="input-group">
        <label for="v2">Final Notu (V2):</label>
        <input type="number" id="v2" placeholder="Örnek: 70" min="0" max="100">
    </div>

    <div class="input-group">
        <label for="katsayi">Katsayı (Ağırlık):</label>
        <input type="number" id="katsayi" placeholder="Örnek: 0.3" step="0.01" min="0" max="1.0">
    </div>
    
    <button onclick="calculateNotes()">Notları Hesapla</button>
    
    <div id="result">
        <h3 style="color: #28a745; margin-top: 0;">Sonuçlar</h3>
        <div class="result-item"><span>Ortalama Puan:</span> <span id="ort"></span></div>
        <div class="result-item"><span>Harf Notu:</span> <span id="harf_notu"></span></div>
        <div class="result-item"><span>Durum:</span> <span id="durum"></span></div>
    </div>
</div>

<script>
    function calculateNotes() {
        // 1. Input Değerlerini Alma ve Sayısal Kontrol
        const v1 = parseFloat(document.getElementById('v1').value);
        const v2 = parseFloat(document.getElementById('v2').value);
        const katsayi = parseFloat(document.getElementById('katsayi').value);

        // Geçerli girdi kontrolü
        if (isNaN(v1) || isNaN(v2) || isNaN(katsayi) || v1 < 0 || v2 < 0 || katsayi < 0) {
            alert("Lütfen tüm alanları geçerli sayısal değerlerle doldurun.");
            document.getElementById('result').style.display = 'none';
            return;
        }

        // 2. Hesaplama Formülü
        // Formül: (V1 * (1 - Katsayı)) + (V2 * Katsayı)
        const ortalamaPuan = (v1 * (1 - katsayi)) + (v2 * katsayi);
        const ortalamaPuanRonde = ortalamaPuan.toFixed(2);

        // 3. Harf Notu Belirleme Fonksiyonu
        let harfNotu = '';
        let durum = '';
        
        if (ortalamaPuan >= 90) {
            harfNotu = 'AA';
            durum = 'Geçti';
        } else if (ortalamaPuan >= 80) {
            harfNotu = 'BA';
            durum = 'Geçti';
        } else if (ortalamaPuan >= 70) {
            harfNotu = 'BB';
            durum = 'Geçti';
        } else if (ortalamaPuan >= 60) {
            harfNotu = 'BC';
            durum = 'Geçti';
        } else if (ortalamaPuan >= 50) {
            harfNotu = 'CC';
            durum = 'Geçti (Sınırda)';
        } else {
            harfNotu = 'FF';
            durum = 'Kaldı';
        }

        // 4. Sonuçları Ekrana Yazdırma
        document.getElementById('ort').textContent = `${ortalamaPuanRonde} / 100`;
        document.getElementById('harf_notu').textContent = harfNotu;
        document.getElementById('durum').textContent = durum;
        
        // Sonuç kutucuğunu göster
        document.getElementById('result').style.display = 'block';
    }
</script>

</body>
</html>
